[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ace"
version = "0.4.1"
description = "Non-parametric multivariate regressions by Alternating Conditional Expectations"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Touran", email = "ace@partofthething.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.2",
]
keywords = ["regression", "ace", "multivariate", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff"]
docs = ["sphinx", "sphinx-rtd-theme", "numpydoc", "matplotlib>=3.6"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[project.urls]
Homepage = "https://github.com/partofthething/ace"
Documentation = "http://partofthething.com/ace"
Changelog = "https://github.com/partofthething/ace/blob/master/HISTORY.rst"

[tool.setuptools.packages.find]
include = ["ace*"]

[tool.pytest.ini_options]
testpaths = ["ace/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp_images"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "D", "C4", "SIM", "RUF", "PIE", "PERF", "PTH", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["ace"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"ace/tests/*" = ["D"]
"doc/conf.py" = ["D", "E402"]
